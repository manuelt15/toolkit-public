# Catálogo de skills del toolkit. Fuente única para el CLI, la web y la skill nuevo-proyecto.
#
# Campos:
#   id            nombre de la skill (el `name:` de su SKILL.md)
#   para_que      una línea, la que ve el usuario en el wizard
#   origen        propia (viaja en el paquete y se copia) | externa (se instala desde su repo)
#   repo          repo de GitHub de donde sale (externas)
#   instalar      comando; {agentes} se sustituye por "-a claude-code -a codex -a hermes-agent"
#   plugin_claude en Claude se instala este plugin en vez de la skill (nunca los dos)
#   scope         proyecto | global
#   cuando        siempre: true, o módulos que la traen (y opcion, si el módulo tiene opciones)
#   nivel         incluida (no se quita) | obligatoria | recomendada | opcional
#   incluye       ids que ya trae esta colección (no se ofrecen sueltas)
#   conflicts_with  ids que no deben convivir con esta
#   licencia      SPDX del repo; NONE = el repo no declara licencia (solo se referencia)
#   aviso         lo que el usuario debe saber antes de instalarla (se enseña en el wizard)
#   verificado    fecha en que se comprobó repo, nombre y comando en la fuente

# ── Flujo (propias) ─────────────────────────────────────────────────────────

- id: cierre
  para_que: Deja handover, pendientes y lecciones para que la siguiente sesión sepa qué seguir
  origen: propia
  scope: proyecto
  cuando: { siempre: true }
  nivel: incluida
  licencia: MIT

- id: nuevo-proyecto
  para_que: La parte con criterio del arranque, entender qué vas a construir y proponer módulos
  origen: propia
  scope: global
  cuando: { siempre: true }
  nivel: incluida
  licencia: MIT

- id: seguridad-rgpd
  para_que: RGPD, LOPDGDD, LSSI-CE, AI Act y seguridad mínima, con lo que bloquea un lanzamiento
  origen: propia
  scope: proyecto
  cuando: { modulos: [auth, pagos, email, datos, legal, agentes-ia] }
  nivel: obligatoria
  licencia: MIT

# ── Globales del primer arranque ────────────────────────────────────────────

- id: grill-me
  para_que: Te interroga sobre el plan hasta cerrar las decisiones abiertas antes de codificar
  origen: externa
  repo: mattpocock/skills
  instalar: npx skills add mattpocock/skills --skill grill-me -g {agentes}
  scope: global
  cuando: { siempre: true }
  nivel: recomendada
